# Panel web + proxy inverso hacia la API.
#
# El navegador habla solo con este servidor (mismo origen): el panel llama
# a /api/... y nginx lo reenvia a la API. Asi no hay que conocer el puerto
# 8000 desde el navegador ni depender de CORS, y la demo funciona igual
# abriendo http://localhost:8080 que desde otro equipo de la red.

# Primera barrera contra rafagas (E7): limite por token en nginx, antes de
# que la peticion llegue a Python. La cuota por EMPRESA la sigue aplicando
# la API (Redis); esto solo corta los abusos groseros de forma baratisima.
# Sin token (login, estaticos), el limite es por IP.
map $http_authorization $clave_limite {
    default $http_authorization;
    ""      $binary_remote_addr;
}
limit_req_zone $clave_limite zone=por_cliente:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Resolver en cada peticion (en vez de al
    # arrancar) permite que nginx arranque aunque la API aun no este lista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        # 20 peticiones/s sostenidas y rafagas de 40: el panel y el chat no
        # se acercan ni de lejos; un script en bucle, si.
        limit_req zone=por_cliente burst=40 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El mismo id en el log de nginx y en el de la API (trazabilidad)
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 90s;   # una respuesta del LLM puede tardar
    }

    # (add_header no se hereda en bloques que definen el suyo, por eso las
    # cabeceras de seguridad se repiten en cada location)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }
}
