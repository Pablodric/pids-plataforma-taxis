name: pids

services:

  # -------------------------------------------------------------------
  # Almacenamiento principal: Postgres.
  # Elegido por Row Level Security nativa, que es lo que permite aislar
  # empresas (E7) a nivel de motor y no solo en el codigo de la API.
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pids
    volumes:
      - datos_db:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan solos la primera vez
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pids"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Segundo almacenamiento: Redis.
  # Estado efimero (historial de conversacion) y contadores de cuota
  # por empresa. Separar esto de Postgres evita castigar la base de
  # datos analitica con escrituras de sesion.
  # -------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Ingesta: se ejecuta una vez, carga el CSV y termina.
  # -------------------------------------------------------------------
  ingesta:
    build: ./ingest
    environment:
      DATABASE_URL_ADMIN: postgresql://postgres:postgres@db:5432/pids
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------
  # API + chatbot.
  # Se conecta como 'pids_app' (rol sin superusuario) para que las
  # politicas RLS se apliquen de verdad.
  # -------------------------------------------------------------------
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://pids_app:pids_app_pw@db:5432/pids
      REDIS_URL: redis://cache:6379/0
      JWT_SECRETO: ${JWT_SECRETO:-cambiar-en-produccion}
      # Motor del chatbot: reglas | ollama | openai | anthropic
      # 'auto' elige el primero que este configurado (reglas si no hay nada).
      LLM_PROVEEDOR: ${LLM_PROVEEDOR:-auto}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODELO: ${LLM_MODELO:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      VENTANA_CUOTA_SEG: ${VENTANA_CUOTA_SEG:-60}
    ports:
      - "8000:8000"
    volumes:
      # Solo para poder lanzar la bateria de pruebas dentro del contenedor
      - ./tests:/srv/tests:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      ingesta:
        condition: service_completed_successfully
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Ollama: modelo de lenguaje abierto ejecutandose en la propia
  # infraestructura. Sin clave, sin coste y sin que los datos salgan de
  # la plataforma.
  #
  # Va en un PERFIL opcional para no penalizar el arranque normal: solo
  # se levanta con  docker compose --profile ollama up
  # -------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - modelos_ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Descarga el modelo la primera vez y termina. En arranques posteriores
  # lo encuentra en el volumen y no vuelve a bajarlo.
  ollama-modelo:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODELO:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------
  # Panel web (chat + graficas). Nginx sirviendo estaticos.
  # -------------------------------------------------------------------
  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  datos_db:
  modelos_ollama:
